[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not live"
markers =
    stage1: Stage 1 data
    stage2: Stage 2 profiles and segments
    stage3: Stage 3 policy
    stage4: Stage 4 generation
    stage5: Stage 5 guardrails, review, delivery
    stage6: Stage 6 evaluation
    live: needs network or an LLM key